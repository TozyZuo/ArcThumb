# Build a testable installer for the LIVP feature branch. This runs
# independently of the release workflow: it never tags, publishes a
# release, or changes the package version.

name: LIVP test installer

on:
  workflow_dispatch:
  push:
    branches: [codex/livp-thumbnail-support]

concurrency:
  group: livp-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # This branch exists to produce a user-testable installer.
        # Report lints, but leave compile errors/tests/build failures as
        # the gates so a new stable-Rust warning cannot suppress the
        # artifact entirely.
        run: cargo clippy --all-targets

      - name: Test
        shell: pwsh
        run: |
          cargo build --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test 2>&1 | Tee-Object -FilePath test-output.txt
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # Public fork logs require a signed-in GitHub session. Put the
            # useful tail in the check annotation as well so a failed test is
            # diagnosable through the checks API.
            $message = (Get-Content test-output.txt | Select-Object -Last 80) -join "`n"
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Rust tests failed::$message"
            exit $testExit
          }

      - name: Build release binaries
        run: cargo build --release

      - name: Prepare playback runtime
        shell: pwsh
        run: ./scripts/prepare-libvlc.ps1

      - name: Package installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/arcthumb.iss
          options: /O+

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ArcThumb-LIVP-Setup
          path: target/installer/ArcThumb-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic binaries
        uses: actions/upload-artifact@v4
        with:
          name: ArcThumb-LIVP-Binaries
          path: |
            target/release/arcthumb.dll
            target/release/arcthumb-config.exe
            target/release/libvlc/
          if-no-files-found: error
          retention-days: 14
